<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1><img src="../icons/icon-48.png" alt="" width="18" height="18" /> hidenews</h1>

    <section class="mode">
      <label>
        <input type="radio" name="mode" value="hide-ai" id="mode-hide" />
        <span>Hide AI stories</span>
      </label>
      <label>
        <input type="radio" name="mode" value="only-ai" id="mode-only" />
        <span>Only show AI stories</span>
      </label>
    </section>

    <section class="threshold">
      <label for="threshold">AI cutoff: <span id="thrLabel">0.50</span></label>
      <input type="range" id="threshold" min="0.1" max="0.9" step="0.01" value="0.5" />
      <div class="scale"><span>strict</span><span>loose</span></div>
    </section>

    <section class="view">
      <button type="button" id="debugBtn" aria-pressed="false">Debug view: off</button>
    </section>

    <section class="model">
      <div class="status" id="modelStatus">checking model…</div>
      <div class="progress"><div class="bar" id="modelBar"></div></div>
    </section>

    <footer><small>Model: Laya-Q8_0, runs fully on-device.</small><div class="modelurl" id="modelUrl"></div></footer>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
